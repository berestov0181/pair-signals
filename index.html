<!DOCTYPE html>
<html><head><meta charset=utf-8>
<meta http-equiv="refresh" content="300">
<title>Pair Signal Hunter</title>
<style>
body{font-family:monospace;background:#111;color:#0f0;padding:20px;max-width:800px;margin:0 auto}
h1{color:#ff0}h2{color:#0af}
table{border-collapse:collapse;width:100%;margin-bottom:20px}
td,th{border:1px solid #333;padding:8px;text-align:left}
th{background:#222}.pos{color:#0f0}.neg{color:#f00}.news{color:#ff0}
.badge{background:#0af;color:#000;padding:2px 6px;border-radius:3px;font-size:12px}
</style></head><body>
<h1>🎯 Pair Signal Hunter</h1>
<p>Автоматическая парная торговля | Bybit Futures</p>
<div id="data"><p>Загрузка...</p></div>
<script>
fetch('signals.json?t='+Date.now())
.then(r=>r.json()).then(d=>{
  let h = '<h2>📊 Статистика Bot-B</h2>'
  h += '<table><tr><th>Сделок</th><th>Winrate</th><th>P&L</th><th>Баланс</th><th>Обновлено</th></tr>'
  h += '<tr><td>'+d.trades+'</td><td>'+d.winrate+'%</td>'
  h += '<td class="'+(d.pnl>0?'pos':'neg')+'">'+d.pnl+'</td>'
  h += '<td>$'+d.balance+'</td><td>'+d.updated+'</td></tr></table>'
  h += '<h2>🔴 Активные сигналы</h2>'
  h += '<table><tr><th>Пара</th><th>Z-score</th><th>Направление</th><th>Тип</th></tr>'
  d.signals.forEach(s=>{
    h += '<tr><td><b>'+s.pair+'</b></td>'
    h += '<td class="'+(s.mode=='NEWS'?'news':'pos')+'">'+s.z+'</td>'
    h += '<td>'+s.direction+'</td>'
    h += '<td><span class="badge">'+s.mode+'</span></td></tr>'
  })
  h += '</table><h2>📋 Последние сделки</h2>'
  h += '<table><tr><th>Пара</th><th>P&L</th><th>Баланс</th></tr>'
  d.history.forEach(t=>{
    h += '<tr><td>'+t.pair+'</td>'
    h += '<td class="'+(t.pnl>0?'pos':'neg')+'">'+t.pnl+'</td>'
    h += '<td>$'+t.balance+'</td></tr>'
  })
  h += '</table>'
  document.getElementById('data').innerHTML = h
}).catch(e=>document.getElementById('data').innerHTML='<p>Нет данных</p>')
</script>
</body></html>
